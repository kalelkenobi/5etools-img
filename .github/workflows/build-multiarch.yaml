name: Sync upstream and build multi-arch image

on:
 workflow_dispatch:
 schedule:
   - cron: "0 6 * * *"
 push:
   branches:
     - main

permissions:
 contents: write
 packages: write

env:
 IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/5etools-img
 UPSTREAM_REPO: https://github.com/5etools-mirror-3/5etools-img.git
 UPSTREAM_BRANCH: main

jobs:
 sync-and-build:
   runs-on: ubuntu-latest

   steps:
     - name: Check out fork
       uses: actions/checkout@v4
       with:
         fetch-depth: 0

     - name: Sync from upstream
       if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
       run: |
         git config user.name "github-actions[bot]"
         git config user.email "github-actions[bot]@users.noreply.github.com"

         git remote add upstream "${UPSTREAM_REPO}" || true
         git fetch upstream "${UPSTREAM_BRANCH}"

         CURRENT_BRANCH="${GITHUB_REF_NAME}"
         git checkout "$CURRENT_BRANCH"

         git merge "upstream/${UPSTREAM_BRANCH}" --no-edit || {
           echo "Upstream merge failed. Resolve conflicts manually."
           exit 1
         }

         git push origin "$CURRENT_BRANCH"

     - name: Free disk space
       run: |
         sudo rm -rf /usr/share/dotnet
         sudo rm -rf /opt/ghc
         sudo rm -rf /usr/local/lib/android
         docker system prune -af

     - name: Set up QEMU
       uses: docker/setup-qemu-action@v3

     - name: Set up Docker Buildx
       uses: docker/setup-buildx-action@v3

     - name: Log in to GitHub Container Registry
       uses: docker/login-action@v3
       with:
         registry: ghcr.io
         username: ${{ github.actor }}
         password: ${{ secrets.GITHUB_TOKEN }}

     - name: Generate Docker metadata
       id: meta
       uses: docker/metadata-action@v5
       with:
         images: ${{ env.IMAGE_NAME }}
         tags: |
           type=raw,value=latest
           type=sha,prefix=sha-
           type=ref,event=branch
           type=ref,event=tag

     - name: Build and push multi-arch image
       uses: docker/build-push-action@v6
       with:
         context: .
         platforms: linux/amd64,linux/arm64
         push: true
         tags: ${{ steps.meta.outputs.tags }}
         labels: ${{ steps.meta.outputs.labels }}
